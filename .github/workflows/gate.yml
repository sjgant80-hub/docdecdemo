name: gate
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the page inlines the grounding kernel byte-for-byte, and the kernel routes/abstains
        run: node --test page-parity.test.mjs
      - name: every published number is recomputed from the shipped raw data (and the fast search is proven equal to the kernel)
        run: node --test rerun.test.mjs
